name: Feature request
description: 建议新的 DIANA 工作流、工具或知识能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述工程工作流中的实际困难，而不只是建议一个接口名字。
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: 期望工作流
      description: 说明人、AI、DianaIE 和求解器各自做什么。
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 人工审阅与安全边界
      description: 说明此功能是否修改模型、提交计算、覆盖文件或扩大自动化范围。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 可公开的手册章节或最小示例
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 此 Issue 不包含客户模型、专有手册内容、凭据或未经脱敏的日志。
          required: true
